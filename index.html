<!doctype html>
<html lang="ja">
<head>
<script src="api.js?v=202611031855"></script>
<script src="user.js?v=202611031855"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 10 Mock Exams</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --muted: #6a707a; --line: #dcdad3;
    --accent: #1d5fa8; --accent-soft: #e5eef9; --ok: #1f7a3f; --ok-soft: #e3f3e8;
    --bad: #b3261e; --bad-soft: #fbe6e4; --warn: #b26a00; --warn-soft: #fff1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --card: #1f2226; --ink: #e8e6e1; --muted: #9aa0a8; --line: #33373d;
      --accent: #6aa8ef; --accent-soft: #1d2b3c; --ok: #5cc184; --ok-soft: #1b2e22;
      --bad: #f08a80; --bad-soft: #3a1f1d; --warn: #f0b04a; --warn-soft: #3a2c14;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Segoe UI", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  h2 { font-size: 19px; margin: 28px 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 12px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .exam-card h3 { margin: 0 0 4px; font-size: 17px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }

  /* exam */
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .topbar .in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .topbar .title { font-weight: 600; flex: 1; min-width: 180px; }
  .timer { font: 600 22px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 6px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
  .timer.warn { background: var(--warn-soft); color: var(--warn); }
  .timer.over { background: var(--bad-soft); color: var(--bad); }
  .phase { font-size: 13px; color: var(--muted); }
  .layout { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .nav { position: static !important; } }
  .nav { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-size: 14px; }
  .nav .sec { font-weight: 600; margin: 10px 0 4px; }
  .nav .dots { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav .dot { width: 30px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--card);
    font-size: 12px; display: grid; place-items: center; color: var(--muted); text-decoration: none; }
  .nav .dot.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .section-head { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 24px 0 8px; }
  .section-head h2 { margin: 0; }
  .q { scroll-margin-top: 80px; }
  .q .qhead { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
  .q .qtext { white-space: pre-wrap; margin: 6px 0 10px; }
  .q table { border-collapse: collapse; margin: 6px 0 12px; font-size: 14px; }
  .q td, .q th { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .opts { display: grid; gap: 6px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 12px; }
  .opt .L { font-weight: 700; min-width: 18px; }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  textarea { width: 100%; min-height: 90px; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
  textarea.long { min-height: 200px; }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .match td:first-child { min-width: 200px; }
  .wc { font-size: 13px; color: var(--muted); text-align: right; }
  .wc.bad { color: var(--warn); }
  .choice { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); }
  .model { margin-top: 10px; padding: 10px 12px; border-left: 4px solid var(--ok); background: var(--ok-soft); white-space: pre-wrap; font-size: 14px; }
  .explain { margin-top: 8px; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .locked .opts, .locked textarea, .locked select { pointer-events: none; opacity: .55; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .overlay .card { max-width: 460px; }
  .save-state { font-size: 12px; color: var(--muted); min-width: 90px; }

  /* drawing pad */
  .dp { margin: 6px 0 10px; }
  .dp-wrap { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--bg); }
  .dp-bar { display: grid; gap: 6px; margin-bottom: 8px; }
  .dp-tools { display: flex; flex-wrap: wrap; gap: 4px; }
  .dp-tools button { display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 4px 6px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink); font-size: 16px; line-height: 1.1; }
  .dp-tools button small { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .dp-tools button.on { border-color: var(--accent); background: var(--accent-soft); }
  .dp-tools button.on small { color: var(--accent); }
  .dp-opts { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; }
  .dp-opts label { display: inline-flex; gap: 4px; align-items: center; }
  .dp-opts input[type=number] { width: 64px; font: inherit; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .dp-opts button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 3px 9px; }
  .dp-sp { flex: 1; }
  .dp-cv { display: block; touch-action: none; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); max-width: 100%; }
  .dp-info { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 18px; }
  .dp-full { position: fixed; inset: 0; z-index: 30; background: var(--card); margin: 0; padding: 10px; overflow: auto; }
  .dp-full .dp-wrap { min-height: 100%; }
  .dp-label { font-size: 13px; font-weight: 600; margin-top: 10px; }
  .paper { display: block; margin: 14px 0; }
  .paper img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  details.ab { margin: 4px 0 10px; font-size: 14px; }
  details.ab summary, details.card summary { cursor: pointer; color: var(--accent); }
  .opt span:empty { display: none; }
  .opts.row4 { grid-template-columns: repeat(4, minmax(56px, 90px)); }
  .opts.row4 .opt { justify-content: center; }
  .dp-zoom, .dp-hint { display: none; }
  .dp-full .dp-zoom { display: inline-flex; gap: 4px; }
  .dp-zoom button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .dp-full .dp-cv { max-width: none; }
  .dp-full .dp-bar { position: sticky; top: 0; left: 0; z-index: 2; background: var(--bg); padding-bottom: 4px; }
  body.dp-open { overflow: hidden; }
  /* スマホ: ふだんの図は見るだけ（指でスクロールできる）。「拡大して描く」で全画面にして描く */
  @media (max-width: 800px), (pointer: coarse) and (max-height: 500px) {
    .dp:not(.dp-full) .dp-cv { touch-action: pan-y pinch-zoom; }
    .dp:not(.dp-full) .dp-tools, .dp:not(.dp-full) .dp-opts > :not([data-a="full"]) { display: none; }
    .dp:not(.dp-full) [data-a="full"] { width: 100%; padding: 10px; font-size: 16px; background: var(--accent); border-color: var(--accent); color: #fff; border-radius: 8px; }
    .dp-full { padding: 6px; }
    .dp-full .dp-tools, .dp-full .dp-opts { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; }
    .dp-full .dp-tools button { min-width: 54px; flex-shrink: 0; }
    .dp-full .dp-opts > * { flex-shrink: 0; }
    .dp-full .dp-opts .dp-sp { display: none; }
    .dp-full .dp-opts button { padding: 6px 10px; }
    /* 閉じる・拡大縮小・動かすは画面の下に固定（ツールの列をスクロールしても見える） */
    .dp-full [data-a="full"] { position: fixed; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 3;
      padding: 10px 18px !important; font-size: 16px; background: var(--accent); border-color: var(--accent); color: #fff; border-radius: 10px; }
    .dp-full .dp-zoom { position: fixed; left: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 3; }
    .dp-full .dp-zoom button { padding: 10px 14px !important; font-size: 16px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.2); }
    .dp-full .dp-hint { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom)); text-align: center; }
  }
  @media (orientation: portrait) and (max-width: 800px) { .dp-full .dp-hint { display: inline; font-size: 12px; color: var(--warn); } }

  /* home（タブ: 模試・練習・記録・使い方） */
  a.btn { text-decoration: none; display: inline-block; }
  .btn.small { padding: 4px 10px; font-size: 14px; }
  .hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hero h1 { margin: 4px 0 2px; }
  .who { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .who small { color: var(--muted); margin-left: 6px; font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin: 18px 0 8px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 10px 16px; border-bottom: 3px solid transparent; font-weight: 600; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .ic { margin-right: 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; scrollbar-width: none; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; white-space: nowrap; font-size: 15px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .group h2 { margin: 22px 0 2px; }
  .group .sub { margin: 0 0 6px; font-size: 14px; }
  .card.list { padding: 4px 16px; }
  .erow, .hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .card.list > .erow:first-child, .card.list > .hrow:first-child { border-top: 0; }
  .ename { display: flex; flex-direction: column; min-width: 0; }
  .ename .muted { font-size: 13px; }
  .ebtn { display: flex; gap: 6px; flex-shrink: 0; }
  .resume { border-color: var(--accent); }
  .resume .erow { border-top: 0; }
  .hscore { text-align: right; flex-shrink: 0; }
  .tiny { font-size: 12px; }
  .small-note { font-size: 13px; margin-top: 18px; }
  .lead { margin: 6px 0 4px; }
  .pcard { display: flex; flex-direction: column; margin: 0; }
  .pcard h3 { margin: 2px 0 4px; font-size: 18px; }
  .pcard h3 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .pcard p { margin: 0 0 12px; font-size: 14px; flex: 1; }
  .empty { text-align: center; padding: 28px; }
  .guide h2 { margin: 0 0 10px; font-size: 18px; }
  .guide p { margin: 0 0 10px; }
  .step { display: flex; gap: 12px; padding: 8px 0; }
  .step .num { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .step .muted { font-size: 14px; }
  .how { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 8px 12px; font-size: 15px; }
  .how dt { font-weight: 700; }
  .how dd { margin: 0; color: var(--muted); }
  .tips { margin: 0; padding-left: 1.2em; font-size: 15px; } .tips li { margin: 6px 0; }
  body.home-mode .y10u-pill, body.exam-mode .y10u-pill { display: none; }

  /* exam: 問題一覧・上のバー */
  .navbtn, .t-short, .nav-head, .nav-acts { display: none; }
  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .match select { max-width: min(100%, 360px); }
  .nav-shade { display: none; }
  .layout > main { min-width: 0; } /* 長い選択肢や表で横にはみ出さない */

  @media (max-width: 800px) {
    body { font-size: 16px; }
    .wrap { padding: 14px 14px calc(84px + env(safe-area-inset-bottom)); }
    h1 { font-size: 21px; }
    .who small { display: none; }
    /* タブはアプリのように画面の下 */
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; margin: 0; background: var(--card); border-top: 1px solid var(--line); border-bottom: 0;
      padding: 4px 4px env(safe-area-inset-bottom); gap: 0; box-shadow: 0 -2px 10px rgba(0,0,0,.08); }
    .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0 8px; font-size: 12px; border-bottom: 0; border-top: 3px solid transparent; }
    .tabs button.on { border-top-color: var(--accent); }
    .tabs .ic { margin: 0; font-size: 20px; line-height: 1.2; }
    .group h2 { font-size: 18px; }
    .card { padding: 14px; }
    .card.list { padding: 2px 14px; }
    .erow { padding: 12px 0; }
    .erow .btn { padding: 10px 14px; }
    .erow .btn.small { padding: 10px 10px; }
    .grid { grid-template-columns: 1fr; }
    .how { grid-template-columns: 1fr; gap: 2px; } .how dd { margin-bottom: 8px; }

    /* 試験画面 */
    .topbar .in { padding: 6px 10px; gap: 8px; flex-wrap: nowrap; }
    .navbtn { display: inline-flex; align-items: center; gap: 2px; padding: 8px 10px; font-size: 16px; }
    #prog { font-size: 12px; color: var(--muted); }
    .topbar .title { min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-long, .wide, .desk-only, .phase, .topbar .save-state { display: none; }
    .t-short { display: inline; }
    .timer { font-size: 18px; padding: 6px 8px; }
    .topbar .btn { padding: 8px 12px; white-space: nowrap; }
    .layout { padding: 10px; gap: 0; }
    .nav { display: none; }
    body.navOpen { overflow: hidden; }
    body.navOpen .nav-shade { display: block; position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,.45); }
    body.navOpen .nav { display: block; position: fixed !important; left: 0; right: 0; bottom: 0; top: auto; z-index: 25; margin: 0;
      max-height: 78vh; border-radius: 16px 16px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
    .nav-head { display: flex; align-items: center; gap: 10px; } .nav-head .muted { flex: 1; font-size: 14px; }
    .nav-acts { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 4px; }
    .nav .dot { width: 44px; height: 40px; font-size: 14px; }
    .nav .dots { gap: 6px; }
    .q { scroll-margin-top: 64px; }
    .section-head { padding: 10px 14px; margin: 18px 0 6px; }
    .section-head h2 { font-size: 17px; }
    .opt { padding: 12px 14px; min-height: 48px; align-items: center; }
    .q table { font-size: 14px; }
    /* マッチング: 1行ずつ縦に並べる */
    .match, .match tbody, .match tr, .match td { display: block; width: 100%; }
    .match tr { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; padding: 8px 10px; }
    .match td { border: 0 !important; padding: 2px 0 !important; min-width: 0 !important; }
    .match select { width: 100%; max-width: 100%; padding: 10px; font-size: 16px; }
    textarea { font-size: 16px; }
    select { font-size: 16px; }
  }
</style>

<body>
<div id="app"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return r.json();
};
const words = t => (t || "").trim().split(/\s+/).filter(Boolean).length;
const fmt = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };

let S = null; // exam state
const ORDER = ["Mathematics", "Commercial Studies", "Office Technology", "Basic Science", "Social Science", "Basic Technology"];

/* ---------- home ---------- */
const WEB = !!window.Y10;            // ウェブ版（api.js が入っている）
const ONLY = window.Y10_ONLY || null; // ウェブ版で出す教科のコード（例: ["ot", "bt"]）
const CODE = { "Mathematics": "math", "Commercial Studies": "commercial", "Office Technology": "ot", "Basic Science": "science", "Social Science": "social", "Basic Technology": "bt" };
const SHORT = { "Mathematics": "Math", "Commercial Studies": "Commercial", "Office Technology": "Office Tech", "Basic Science": "Science", "Social Science": "Social", "Basic Technology": "Basic Tech" };
const KINDS = [
  ["mock3", "模試 第3回", "第2回と同じ学校の形式の新作問題です。"],
  ["mock26", "模試 第2回", "学校の Holiday Assignment 2026・テストと同じ形式・単元の新作問題です。"],
  ["past", "過去問（2019年 本番）", "本物の問題用紙をページ画像で表示します。提出後に公式の詳しい解答が見られます。"],
  ["mock", "模試 第1回（オリジナル）", "2019年と同じ形式・配点の新作問題です。"]];
const TABS = [["exams", "模試", "📝"], ["practice", "練習", "🎯"], ["history", "記録", "📊"], ["guide", "使い方", "❓"]];
const store = { get: k => { try { return localStorage.getItem("y10home:" + k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem("y10home:" + k, v); } catch {} } };
let H = null; // home state

async function home() {
  S = null; document.body.classList.remove("exam-mode", "navOpen");
  document.title = "Year 10 Mock Exams";
  const [exams, hist] = await Promise.all([api("/api/exams"), api("/api/history")]);
  const subs = ORDER.filter(s => exams.some(e => e.subject === s));
  H = { exams, hist, subs, tab: store.get("seenGuide") ? store.get("tab") || "exams" : "guide",
        subj: subs.includes(store.get("subj")) ? store.get("subj") : "all" };
  store.set("seenGuide", "1");
  document.body.classList.add("home-mode");
  const me = window.Y10U?.me;
  $("#app").innerHTML = `
  <div class="wrap home">
    <header class="hero">
      <div><h1>Year 10 過去問・模試</h1>
        <div class="muted">${H.subs.map(esc).join("・")}</div></div>
      ${me ? `<button class="who" id="whoBtn">👤 ${esc(me)}<small>切り替え</small>${window.Y10?.pending() ? `<span class="badge">未送信 ${window.Y10.pending()}</span>` : ""}</button>` : ""}
    </header>
    <nav class="tabs" id="tabs">${TABS.map(([k, n, ic]) => `<button data-tab="${k}"><span class="ic">${ic}</span><span>${n}</span></button>`).join("")}</nav>
    <div id="tabBody"></div>
  </div>`;
  $("#whoBtn")?.addEventListener("click", () => window.Y10U.ask());
  $("#tabs").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { H.tab = b.dataset.tab; store.set("tab", H.tab); drawTab(); window.scrollTo(0, 0); });
  drawTab();
}

function drawTab() {
  $("#tabs").querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === H.tab));
  const el = $("#tabBody");
  el.innerHTML = { exams: examsTab, practice: practiceTab, history: historyTab, guide: guideTab }[H.tab]();
  el.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(b.dataset.start, false));
  el.querySelectorAll("[data-resume]").forEach(b => b.onclick = () => start(b.dataset.resume, true));
  el.querySelectorAll("[data-restart]").forEach(b => b.onclick = async () => {
    if (!confirm("途中の答案を消して最初から始めますか？")) return;
    await api("/api/discard", { examId: b.dataset.restart }); start(b.dataset.restart, false);
  });
  el.querySelectorAll("[data-subj]").forEach(b => b.onclick = () => { H.subj = b.dataset.subj; store.set("subj", H.subj); drawTab(); });
  el.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { H.tab = b.dataset.goto; store.set("tab", H.tab); drawTab(); window.scrollTo(0, 0); });
}

/* ---------- exam ---------- */
async function start(id, resume) {
  const exam = await api("/api/exam?id=" + id);
  const draft = resume ? await api("/api/draft?id=" + id) : {};
  S = {
    exam, responses: draft.responses || {}, elapsed: draft.elapsedSec || 0, reading: draft.readingLeft ?? (exam.readingMinutes || 0) * 60,
    tick: null, last: Date.now(), dirty: false, submitted: false, result: null,
  };
  document.title = exam.subject + (exam.kind === "past" ? " — 2019 過去問" : " — 模試");
  renderExam();
  S.tick = setInterval(onTick, 500);
  S.saver = setInterval(saveDraft, 15000);
  window.onbeforeunload = () => S && !S.submitted ? "" : undefined;
}

function onTick() {
  const now = Date.now(), dt = (now - S.last) / 1000; S.last = now;
  if (S.submitted) return;
  if (S.reading > 0) { S.reading = Math.max(0, S.reading - dt); if (S.reading === 0) unlock(); }
  else S.elapsed += dt;
  drawTimer();
  if (S.elapsed >= S.exam.minutes * 60) submit(true);
}

function drawTimer() {
  const t = $("#timer"); if (!t) return;
  if (S.reading > 0) { t.textContent = fmt(S.reading); t.className = "timer"; $("#phase").textContent = "読む時間（まだ書けません）"; return; }
  const left = S.exam.minutes * 60 - S.elapsed;
  t.textContent = fmt(left);
  t.className = "timer" + (left <= 60 ? " over" : left <= 600 ? " warn" : "");
  $("#phase").textContent = "残り時間";
}

function unlock() { document.querySelectorAll(".locked").forEach(e => e.classList.remove("locked")); $("#skipRead")?.remove(); drawTimer(); }

function answered(q) {
  const a = S.responses[q.id];
  if (q.type === "mcq") return !!a;
  if (q.type === "match") return a && Object.values(a).filter(Boolean).length === q.items.length;
  if (q.type === "paragraph" && q.choices) return a && a.choice && words(a.text) > 0;
  if (q.type === "draw") return !!(a && ((a.shapes && a.shapes.length) || (a.text && a.text.trim())));
  return typeof a === "string" ? a.trim().length > 0 : !!(a && a.text && a.text.trim());
}

function qHTML(q, n) {
  const a = S.responses[q.id], done = S.submitted;
  let body = "";
  if (q.table) body += `<div class="tbl"><table>${q.table.map((r, i) => `<tr>${r.map(c => i === 0 && q.tableHeader !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  if (q.after) body += `<div class="qtext">${esc(q.after)}</div>`;
  if (q.type === "mcq") {
    body += `<div class="opts${q.options.every(o => !o) ? " row4" : ""}">${q.options.map((o, i) => { const L = "ABCD"[i];
      let cls = a === L ? " sel" : "";
      if (done) cls = L === q.answer ? " right" : a === L ? " wrong" : "";
      return `<button class="opt${cls}" data-q="${q.id}" data-v="${L}"><span class="L">${L}.</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
    if (done && q.explain) body += `<div class="explain">${esc(q.explain)}</div>`;
  } else if (q.type === "match") {
    const opts = q.options.map((o, i) => `<option value="${String.fromCharCode(65 + i)}">${String.fromCharCode(65 + i)}${o ? ". " + esc(o) : ""}</option>`).join("");
    body += `<table class="match">${q.items.map((it, i) => { const v = (a || {})[i] || ""; const ok = done ? (v === q.answer[i] ? " ✓" : ` ✗（正解 ${q.answer[i]}）`) : "";
      return `<tr><td>${i + 1}. ${esc(it)}</td><td><select data-match="${q.id}" data-i="${i}"><option value="">—</option>${opts.replace(`value="${v}"`, `value="${v}" selected`)}</select>${ok}</td></tr>`; }).join("")}</table>
      <table class="mopts">${q.options.map((o, i) => `<tr><td><b>${String.fromCharCode(65 + i)}</b></td><td>${esc(o)}</td></tr>`).join("")}</table>`;
  } else if (q.type === "draw") {
    body += `<div class="dp-label">${q.draw.mode === "tech" ? "製図板（A4 横・1マス 5 mm）" : "座標平面"}</div><div data-pad="${q.id}"></div>`;
    if (q.withText) body += `<div class="dp-label">${esc(q.textLabel || "計算・答え")}</div><textarea data-text="${q.id}" placeholder="Answer / working here.">${esc((a || {}).text || "")}</textarea>`;
    if (done && q.modelShapes) body += `<div class="dp-label" style="color:var(--ok)">模範解答の図（緑）</div><div data-model="${q.id}"></div>`;
    if (done && q.model) body += `<div class="model"><b>模範解答・採点基準</b>\n${esc(q.model)}</div>`;
  } else {
    const isP = q.type === "paragraph";
    if (q.choices) {
      const pick = (a || {}).choice;
      body += q.choices.map((c, i) => `<label class="choice${pick == i + 1 ? " sel" : ""}"><input type="radio" name="ch_${q.id}" data-choice="${q.id}" value="${i + 1}" ${pick == i + 1 ? "checked" : ""}><span><b>${i + 1}.</b> ${esc(c.text)}</span></label>`).join("");
    }
    const text = typeof a === "string" ? a : (a || {}).text || "";
    body += `<textarea class="${isP ? "long" : ""}" data-text="${q.id}" placeholder="${isP ? "Write your paragraph in English." : "Answer here."}">${esc(text)}</textarea>`;
    if (isP && q.minWords) body += `<div class="wc" id="wc_${q.id}"></div>`;
    if (done && q.model) body += `<div class="model"><b>模範解答・採点基準</b>\n${esc(q.model)}</div>`;
  }
  const ab = q.ab ? `<details class="ab"><summary>解答用紙のページを見る</summary>${q.ab.map(p => `<a class="paper" href="${p}" target="_blank"><img src="${p}" loading="lazy" alt="answer booklet"></a>`).join("")}</details>` : "";
  return `<div class="card q" id="q_${q.id}"><div class="qhead"><span>${esc(q.label || n)}</span><span class="muted">(${q.marks} mark${q.marks === 1 ? "" : "s"})</span></div>
    ${q.text ? `<div class="qtext">${esc(q.text)}</div>` : ""}${ab}${body}</div>`;
}

function renderExam() {
  const e = S.exam, lockCls = S.reading > 0 && !S.submitted ? "locked" : "";
  document.body.classList.remove("home-mode"); document.body.classList.add("exam-mode");
  $("#app").innerHTML = `
  <div class="topbar"><div class="in">
    <button class="btn navbtn" id="navBtn" aria-label="問題一覧">☰<span id="prog"></span></button>
    <div class="title"><span class="t-long">${esc(e.title)}</span><span class="t-short">${esc(e.subject)}${e.kind === "past" ? "（2019）" : ""}</span></div>
    <span class="save-state" data-save></span>
    ${S.submitted ? "" : `<div class="tbox"><div class="phase" id="phase"></div><div class="timer" id="timer"></div></div>
    ${S.reading > 0 ? `<button class="btn" id="skipRead"><span class="wide">読む時間を</span>とばす</button>` : ""}
    <button class="btn primary" id="submitBtn">提出<span class="wide">する</span></button>`}
    <button class="btn${S.submitted ? "" : " desk-only"}" id="homeBtn">${S.submitted ? "トップへ" : "中断して戻る"}</button>
  </div></div>
  <div class="layout">
    <div class="nav-shade" id="navShade"></div><nav class="nav card" id="nav"></nav>
    <main class="${lockCls}" id="main">
      ${S.result ? resultHTML() : `<div class="card"><b>Instructions</b><div class="qtext">${esc(e.instructions)}</div></div>`}
      ${(() => { const shown = new Set(); return e.sections.map((sec, si) => `<div class="section-head" id="sec_${si}"><h2>${esc(sec.title)}</h2>${sec.note ? `<div class="qtext" style="margin:6px 0 0">${esc(sec.note)}</div>` : ""}</div>
        ${sec.questions.map((q, qi) => (q.pages || []).filter(p => !shown.has(p) && shown.add(p)).map(p =>
          `<a class="paper" href="${p}" target="_blank" title="クリックで拡大"><img src="${p}" loading="lazy" alt="question page"></a>`).join("") + qHTML(q, qi + 1)).join("")}`).join(""); })()}
      ${S.submitted && e.solutions ? `<div class="section-head"><h2>公式の Detailed Solutions（詳しい解答）</h2></div>
        <details class="card" open><summary>${e.solutions.length} ページ（クリックで拡大）</summary>${e.solutions.map(p => `<a class="paper" href="${p}" target="_blank"><img src="${p}" loading="lazy" alt="solution page"></a>`).join("")}</details>` : ""}
    </main>
  </div>`;
  drawNav(); drawTimer(); bind(); mountPads();
  e.sections.forEach(sec => sec.questions.forEach(q => q.minWords && updWC(q)));
}

function resultHTML() {
  const r = S.result;
  return `<div class="card" style="border-color:var(--ok)"><b>提出しました</b>
    <p style="margin:6px 0">自動採点（選択・マッチング）: <b>${r.auto.score} / ${r.auto.max}</b> 点<br>
    記述・パラグラフ: <b>${r.manualMax}</b> 点分は${!WEB ? "Claude の採点待ちです" : r.sent ? "漣さんに送りました。Claude が採点します" : "まだ送れていません（次にページを開いたとき自動で送ります）"}。</p>
    <p class="muted" style="margin:0">${WEB ? "" : `答案ファイル: mock-exam-app/answers/${esc(r.file)}<br>`}下に正解と模範解答を表示しています。</p></div>`;
}

function drawNav() {
  const nav = $("#nav"); if (!nav) return;
  const all = S.exam.sections.flatMap(s => s.questions), n = all.filter(answered).length;
  nav.innerHTML = `<div class="nav-head"><b>問題一覧</b><span class="muted">答えた ${n} / ${all.length}</span>
      <button class="btn small" data-navclose>閉じる</button></div>
    <div class="nav-acts"><span class="save-state" data-save>${esc(S.saveText || "")}</span>
      <button class="btn small" data-navhome>${S.submitted ? "トップへ戻る" : "中断して戻る"}</button></div>` +
    S.exam.sections.map((sec, si) => `<div class="sec">${esc(sec.short || sec.title)}</div><div class="dots">
    ${sec.questions.map((q, qi) => `<a class="dot${answered(q) ? " done" : ""}" href="#q_${q.id}">${esc(q.navLabel || qi + 1)}</a>`).join("")}</div>`).join("");
  const p = $("#prog"); if (p) p.textContent = ` ${n}/${all.length}`;
}
const setSave = t => { S.saveText = t; document.querySelectorAll("[data-save]").forEach(el => el.textContent = t); };

function mountPads() {
  S.pads = {};
  document.querySelectorAll("[data-pad]").forEach(el => {
    const q = find(el.dataset.pad);
    S.pads[q.id] = new DrawPad(el, q.draw, {
      value: S.responses[q.id], readOnly: S.submitted,
      onChange: v => { const a = S.responses[q.id] = S.responses[q.id] || {}; a.shapes = v.shapes; changed(); },
    });
  });
  document.querySelectorAll("[data-model]").forEach(el => {
    const q = find(el.dataset.model);
    new DrawPad(el, q.draw, { value: S.responses[q.id], model: q.modelShapes, readOnly: true });
  });
}

function find(id) { for (const s of S.exam.sections) for (const q of s.questions) if (q.id === id) return q; }
function updWC(q) {
  const el = $("#wc_" + q.id); if (!el) return;
  const a = S.responses[q.id], n = words(typeof a === "string" ? a : (a || {}).text);
  el.textContent = `${n} words（目安 ${q.minWords}–${q.maxWords}）`;
  el.className = "wc" + (n && (n < q.minWords || n > q.maxWords) ? " bad" : "");
}
function changed() { S.dirty = true; setSave("未保存"); drawNav(); clearTimeout(S.deb); S.deb = setTimeout(saveDraft, 2500); }

function bind() {
  const goHome = async () => { if (!S.submitted) await saveDraft(); stop(); home(); window.scrollTo(0, 0); };
  $("#homeBtn").onclick = goHome;
  $("#navBtn").onclick = () => document.body.classList.toggle("navOpen");
  $("#nav").onclick = ev => { // 問題一覧（スマホでは下から出る）
    if (ev.target.closest("[data-navhome]")) { document.body.classList.remove("navOpen"); return goHome(); }
    if (ev.target.closest("[data-navclose], .dot")) document.body.classList.remove("navOpen");
  };
  $("#navShade").onclick = () => document.body.classList.remove("navOpen");
  const sb = $("#submitBtn"); if (sb) sb.onclick = () => {
    const all = S.exam.sections.flatMap(s => s.questions), un = all.filter(q => !answered(q)).length;
    if (confirm(un ? `未回答が ${un} 問あります。提出しますか？` : "提出しますか？")) submit(false);
  };
  const sk = $("#skipRead"); if (sk) sk.onclick = () => { S.reading = 0; unlock(); saveDraft(); };
  if (S.submitted) return;
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    S.responses[b.dataset.q] = S.responses[b.dataset.q] === b.dataset.v ? "" : b.dataset.v;
    b.parentElement.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", S.responses[b.dataset.q] === o.dataset.v));
    changed();
  });
  document.querySelectorAll("[data-match]").forEach(s => s.onchange = () => {
    const r = S.responses[s.dataset.match] = S.responses[s.dataset.match] || {}; r[s.dataset.i] = s.value; changed();
  });
  document.querySelectorAll("[data-choice]").forEach(r => r.onchange = () => {
    const q = find(r.dataset.choice), a = S.responses[q.id] = S.responses[q.id] || {}; a.choice = +r.value;
    r.closest(".q").querySelectorAll(".choice").forEach(c => c.classList.toggle("sel", c.contains(r)));
    changed();
  });
  document.querySelectorAll("[data-text]").forEach(t => t.oninput = () => {
    const q = find(t.dataset.text);
    if (q.choices || q.type === "draw") { const a = S.responses[q.id] = S.responses[q.id] || {}; a.text = t.value; } else S.responses[q.id] = t.value;
    if (q.minWords) updWC(q); changed();
  });
}

async function saveDraft() {
  if (!S || S.submitted) return;
  try {
    await api("/api/draft", { examId: S.exam.id, responses: S.responses, elapsedSec: S.elapsed, readingLeft: S.reading });
    S.dirty = false; setSave("自動保存 " + new Date().toLocaleTimeString().slice(0, 5));
  } catch { setSave(WEB ? "保存失敗（ブラウザの保存領域がいっぱい？）" : "保存失敗（アプリが終了？）"); }
}

function stop() { clearInterval(S?.tick); clearInterval(S?.saver); window.onbeforeunload = null; }

async function submit(auto) {
  if (S.submitted) return;
  S.submitted = true; stop();
  if (auto) alert("時間切れです。自動で提出します。");
  const images = {};
  for (const [id, pad] of Object.entries(S.pads || {})) if (pad.shapes.length) images[id] = pad.toPNG();
  S.result = await api("/api/submit", { examId: S.exam.id, responses: S.responses, elapsedSec: S.elapsed, autoSubmitted: auto, images });
  renderExam(); window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>

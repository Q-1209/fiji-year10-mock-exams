<!doctype html>
<html lang="ja">
<head>
<script src="api.js"></script>
<script src="user.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文和訳 答え一覧 — Year 10 練習</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --muted: #6a707a; --line: #dcdad3;
    --accent: #1d5fa8; --accent-soft: #e5eef9; --ok: #1f7a3f; --ok-soft: #e3f3e8;
    --bad: #b3261e; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --card: #1f2226; --ink: #e8e6e1; --muted: #9aa0a8; --line: #33373d;
      --accent: #6aa8ef; --accent-soft: #1d2b3c; --ok: #5cc184; --ok-soft: #1b2e22;
      --bad: #f08a80; --warn: #f0b04a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Segoe UI", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  h2 { font-size: 19px; margin: 28px 0 4px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  h3 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin: 12px 0; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl { font-size: 13px; color: var(--muted); min-width: 56px; }
  input[type=search] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 320px; max-width: 100%; }
  .toc { font-size: 14px; columns: 2 260px; margin: 6px 0 0; padding-left: 18px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
  .no { font: 600 12px ui-monospace, Consolas, monospace; color: var(--muted); }
  .en { font: 17px/1.5 Georgia, "Times New Roman", serif; margin: 2px 0 6px; }
  .ja { padding: 6px 10px; border-left: 4px solid var(--ok); background: var(--ok-soft); }
  .hide .ja { color: transparent; cursor: pointer; }
  .hide .ja.open { color: inherit; }
  .hide .ja::before { content: "（クリックで訳を見る）"; color: var(--muted); font-size: 13px; }
  .hide .ja.open::before { content: ""; }
  .keys { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 13px; }
  .chip { padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line); }
  .g { font-size: 12px; font-weight: 700; margin-left: 6px; }
  .g.s2 { color: var(--ok); } .g.s1 { color: var(--warn); } .g.s0 { color: var(--bad); }
  mark { background: #ffe58a; color: #1f2328; }
  @media print {
    .noprint { display: none; }
    body { background: #fff; color: #000; font-size: 11pt; }
    .item { break-inside: avoid; border-color: #bbb; }
    .ja { background: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint"><a href="/">← トップへ戻る</a>　<a href="translate.html">英文和訳の練習へ</a></div>
  <h1>英文和訳 答え一覧（600問）</h1>
  <div class="muted">英文和訳の練習に出る全部の問題と模範訳です。まず読んで知ってから、練習で解いてみてください。「大事な用語」は、訳に入れたい言葉です。</div>

  <div class="card noprint">
    <div class="row"><span class="lbl">教科</span><span class="row" id="subs"></span></div>
    <div class="row" style="margin-top:8px"><span class="lbl">さがす</span>
      <input type="search" id="q" placeholder="英語か日本語で（例: profit、利益）">
      <span class="muted" id="hits" style="font-size:13px"></span></div>
    <div class="row" style="margin-top:8px"><span class="lbl">表示</span>
      <button class="btn" id="hideBtn">訳をかくす（クリックで1つずつ見る）</button>
      <button class="btn" id="printBtn">印刷する</button></div>
    <div id="toc"></div>
  </div>

  <div id="list"></div>
</div>

<script>
const SUBJ = [["math", "Mathematics"], ["commercial", "Commercial Studies"], ["ot", "Office Technology"],
              ["science", "Basic Science"], ["social", "Social Science"], ["bt", "Basic Technology"]];
const GRADE = [["前回: できなかった", "s0"], ["前回: だいたい", "s1"], ["前回: できた", "s2"]];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const S = { subj: "all", data: {}, st: {}, hide: false };

// highlight the search word inside already-escaped text
function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(e, "gi"), m => `<mark>${m}</mark>`);
}

function draw() {
  const q = $("#q").value.trim(), ql = q.toLowerCase();
  const subs = SUBJ.filter(([k]) => S.subj === "all" || S.subj === k);
  let html = "", toc = "", total = 0, no = 0;
  subs.forEach(([k, name]) => {
    const d = S.data[k];
    let sec = "";
    d.units.forEach((u, ui) => {
      const rows = d.items.filter(x => x[0] === ui && (!q || [x[1], x[2], ...x[3]].some(s => s.toLowerCase().includes(ql))));
      if (!rows.length) return;
      const id = `${k}-${ui}`;
      toc += `<li><a href="#${id}">${esc(name)} ・ ${esc(u)}</a>（${rows.length}）</li>`;
      sec += `<h3 id="${id}">${esc(u)}（${rows.length}問）</h3>` + rows.map(x => {
        no++;
        const st = S.st[x[1]];
        return `<div class="item"><div class="no">${no}${st ? `<span class="g ${GRADE[st.g][1]}">${GRADE[st.g][0]}</span>` : ""}</div>
          <div class="en" lang="en">${hl(x[1], q)}</div>
          <div class="ja">${hl(x[2], q)}</div>
          <div class="keys"><span class="muted">大事な用語:</span>${x[3].map(t => `<span class="chip">${hl(t.split("|").join(" / "), q)}</span>`).join("")}</div></div>`;
      }).join("");
      total += rows.length;
    });
    if (sec) html += `<h2>${esc(name)}</h2>` + sec;
  });
  $("#list").innerHTML = html || `<div class="card">見つかりませんでした。</div>`;
  $("#list").classList.toggle("hide", S.hide);
  $("#hits").textContent = q ? `${total}問 見つかりました` : `${total}問`;
  $("#toc").innerHTML = toc ? `<details style="margin-top:10px"><summary class="muted" style="font-size:13px;cursor:pointer">単元の目次</summary><ul class="toc">${toc}</ul></details>` : "";
}

function drawSubs() {
  $("#subs").innerHTML = [["all", "全教科（600問）"], ...SUBJ].map(([k, n]) => `<button class="btn${S.subj === k ? " on" : ""}" data-s="${k}">${n}</button>`).join("");
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { S.subj = b.dataset.s; drawSubs(); draw(); });
}

async function setup() {
  await Promise.all(SUBJ.map(async ([k]) => { S.data[k] = await (await fetch(`translate/${k}.json`, { cache: "no-store" })).json(); }));
  try { S.st = await (await fetch("/api/tstatus", { cache: "no-store" })).json(); } catch { S.st = {}; }
  drawSubs(); draw();
  let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(draw, 200); };
  $("#hideBtn").onclick = () => { S.hide = !S.hide; $("#hideBtn").classList.toggle("on", S.hide); draw(); };
  $("#printBtn").onclick = () => print();
  $("#list").onclick = e => { const j = e.target.closest(".ja"); if (j && S.hide) j.classList.toggle("open"); };
}
setup();
</script>
</body>
</html>
